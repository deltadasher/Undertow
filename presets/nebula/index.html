<!doctype html>
<meta charset="utf-8">
<title>Nebula</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060b; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Nebula: slow clouds of gas made by warping layered noise with itself, in a
// fragment shader drawn at half resolution. The clouds part around the
// pointer, and a click sends a pulse of light outward.
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false });
const cfg = { hue: 250, spread: 90, speed: 1, stars: true };

const FRAG = `
precision highp float;
uniform vec2 res, mouse; uniform float time, hue, spread, stars, pulse; uniform vec2 pulseAt;
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p); f = f * f * (3. - 2. * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
  float v = 0., a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = p * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  return v;
}
vec3 tint(float h) { return 0.5 + 0.5 * cos(6.2832 * (h / 360. - vec3(0., 0.3333, 0.6667))); }
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * res) / res.y, m = (mouse - 0.5 * res) / res.y;
  vec2 away = uv - m;
  vec2 p = uv * 1.6 + away * 0.25 * exp(-dot(away, away) * 6.);   // clouds part around the pointer
  float t = time * 0.03;
  vec2 q = vec2(fbm(p + t), fbm(p + vec2(5.2, 1.3) - t));
  vec2 r = vec2(fbm(p + 3.5 * q + vec2(1.7, 9.2) + t * 1.3), fbm(p + 3.5 * q + vec2(8.3, 2.8) - t));
  float f = fbm(p + 3. * r);
  float gas = smoothstep(0.25, 0.85, f);
  vec3 col = vec3(0.016, 0.02, 0.035);
  col += tint(hue + spread * (q.x - 0.5) * 2.) * gas * 1.0;
  col += tint(hue + spread + 40. * r.y) * pow(gas, 3.) * 0.9;
  col += vec3(1., 0.93, 0.85) * pow(max(0., f * length(r) - 0.55), 2.) * 2.2;
  if (stars > 0.5) {
    vec2 cell = floor(gl_FragCoord.xy / 3.);
    float s = hash(cell);
    col += vec3(0.9, 0.95, 1.) * step(0.9975, s) * (0.4 + 0.6 * sin(time * (1. + s * 3.) + s * 80.)) * (1. - gas * 0.8);
  }
  float d = length(uv - (pulseAt - 0.5 * res) / res.y) - (1. - pulse) * 1.4;
  col += tint(hue + 30.) * exp(-d * d * 60.) * pulse * pulse * 0.5;
  gl_FragColor = vec4(col, 1.);
}`;

let u = {}, clock = 0, pulse = 0, pulseAt = [0, 0], mouse = [-9999, -9999], ok = false;
function resize() {
  canvas.width = Math.max(2, Math.ceil(innerWidth / 2)); canvas.height = Math.max(2, Math.ceil(innerHeight / 2));
  if (ok) gl.viewport(0, 0, canvas.width, canvas.height);
}
if (gl) {
  const make = (type, source) => { const s = gl.createShader(type); gl.shaderSource(s, source); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const program = gl.createProgram();
  gl.attachShader(program, make(gl.VERTEX_SHADER, 'attribute vec2 p; void main() { gl_Position = vec4(p, 0., 1.); }'));
  gl.attachShader(program, make(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program); gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  for (const name of ['res', 'mouse', 'time', 'hue', 'spread', 'stars', 'pulse', 'pulseAt']) u[name] = gl.getUniformLocation(program, name);
  ok = true;
  resize();
  let last = performance.now();
  (function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    clock += dt * cfg.speed; pulse = Math.max(0, pulse - dt / 2.5);
    gl.uniform2f(u.res, canvas.width, canvas.height);
    gl.uniform2f(u.mouse, mouse[0], mouse[1]);
    gl.uniform1f(u.time, clock + 40); gl.uniform1f(u.hue, cfg.hue); gl.uniform1f(u.spread, cfg.spread);
    gl.uniform1f(u.stars, cfg.stars ? 1 : 0); gl.uniform1f(u.pulse, pulse); gl.uniform2f(u.pulseAt, pulseAt[0], pulseAt[1]);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  })(last);
}
const at = e => [e.clientX / 2, canvas.height - e.clientY / 2];
addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse = at(e); });
addEventListener('mouseleave', () => { mouse = [-9999, -9999]; });
addEventListener('mousedown', e => { pulseAt = at(e); pulse = 1; });

window.undertow?.on('prop', ({ name, value }) => { if (name in cfg) cfg[name] = value; });
</script>
