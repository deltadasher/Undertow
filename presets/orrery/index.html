<!doctype html>
<meta charset="utf-8">
<title>Orrery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080910; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Orrery: bodies on Keplerian orbits around a central star, each drawing a
// fading trail; they sweep fast near the star and slow far from it. The system
// leans toward the pointer and a click launches a comet on a long eccentric pass.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { bodies: 8, pace: 4, rings: true };
const TINTS = ['169,156,255', '114,217,231', '236,142,174', '238,233,220'];
const TRAIL = 90, TILT = 0.58;

let W = 0, H = 0, bodies = [], leanX = 0, leanY = 0;
const mouse = { x: 0, y: 0, active: false };

function makeBody(index, total, comet) {
  const spread = total > 1 ? index / (total - 1) : 0.5;
  const body = {
    a: comet ? 0.55 + Math.random() * 0.4 : 0.14 + spread * 0.8,   // semi-major axis, in system radii
    e: comet ? 0.78 + Math.random() * 0.12 : Math.random() * 0.28,
    turn: Math.random() * 6.283,
    anomaly: comet ? 3.4 : Math.random() * 6.283,
    tint: comet ? 3 : index % 3,
    size: comet ? 2 : (index % 4 === 3 ? 5 : 3.5),
    laps: comet ? 1.6 : -1,
    trail: [],   // positions in system radii, so a lean or resize moves the whole trail
    ring: []
  };
  const cosT = Math.cos(body.turn), sinT = Math.sin(body.turn), minor = Math.sqrt(1 - body.e * body.e);
  for (let k = 0; k <= 96 && !comet; k++) {
    const E = k / 96 * 6.283, ox = body.a * (Math.cos(E) - body.e), oy = body.a * minor * Math.sin(E);
    body.ring.push(ox * cosT - oy * sinT, (ox * sinT + oy * cosT) * TILT);
  }
  return body;
}
function seed() {
  bodies = [];
  for (let i = 0; i < Math.round(cfg.bodies); i++) bodies.push(makeBody(i, Math.round(cfg.bodies), false));
}
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }

let last = performance.now(), carry = 0;
function advance() {
  for (let i = bodies.length - 1; i >= 0; i--) {
    const body = bodies[i];
    // Mean motion follows Kepler's third law: n is proportional to a^-1.5.
    const step = 0.006 * cfg.pace / 4 / Math.pow(body.a, 1.5);
    body.anomaly += step;
    if (body.laps >= 0) {
      body.laps -= step / 6.283;
      if (body.laps <= 0) { bodies.splice(i, 1); continue; }
    }
    let E = body.anomaly;   // solve Kepler's equation M = E - e sin E
    for (let k = 0; k < 4; k++) E -= (E - body.e * Math.sin(E) - body.anomaly) / (1 - body.e * Math.cos(E));
    const ox = body.a * (Math.cos(E) - body.e), oy = body.a * Math.sqrt(1 - body.e * body.e) * Math.sin(E);
    const cosT = Math.cos(body.turn), sinT = Math.sin(body.turn);
    // The orbital plane is tilted away from the viewer, hence the flattened y.
    body.trail.push(ox * cosT - oy * sinT, (ox * sinT + oy * cosT) * TILT);
    if (body.trail.length > TRAIL * 2) body.trail.splice(0, 2);
  }
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const tx = mouse.active ? mouse.x / W * 2 - 1 : 0, ty = mouse.active ? mouse.y / H * 2 - 1 : 0;
  leanX += (tx - leanX) * Math.min(1, dt * 1.5); leanY += (ty - leanY) * Math.min(1, dt * 1.5);
  for (carry += dt * 60; carry >= 1; carry -= 1) advance();   // fixed steps, whatever the refresh rate

  g.fillStyle = '#080910'; g.fillRect(0, 0, W, H);
  const radius = Math.min(W, H) * 0.47;
  const cx = W / 2 + leanX * radius * 0.08, cy = H / 2 + leanY * radius * 0.08;
  const halo = g.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.16);
  halo.addColorStop(0, 'rgba(233,184,114,0.55)');
  halo.addColorStop(0.25, 'rgba(233,184,114,0.14)');
  halo.addColorStop(1, 'rgba(233,184,114,0)');
  g.fillStyle = halo;
  g.fillRect(cx - radius * 0.16, cy - radius * 0.16, radius * 0.32, radius * 0.32);
  g.fillStyle = '#eee9dc';
  g.beginPath(); g.arc(cx, cy, 5, 0, 6.283); g.fill();

  g.lineWidth = 1;
  if (cfg.rings) {
    g.strokeStyle = 'rgba(142,148,170,0.16)';
    g.beginPath();
    for (const body of bodies) {
      const ring = body.ring;
      for (let k = 0; k < ring.length; k += 2) {
        if (k === 0) g.moveTo(cx + ring[0] * radius, cy + ring[1] * radius);
        else g.lineTo(cx + ring[k] * radius, cy + ring[k + 1] * radius);
      }
    }
    g.stroke();
  }
  g.lineWidth = 2; g.lineCap = 'round';
  for (const body of bodies) {
    const trail = body.trail, points = trail.length / 2;
    if (points < 2) continue;
    // Three strokes per trail: faint tail, middle, bright head.
    for (let part = 0; part < 3; part++) {
      const from = Math.floor(points * part / 3), to = Math.min(points - 1, Math.floor(points * (part + 1) / 3));
      if (to <= from) continue;
      g.strokeStyle = `rgba(${TINTS[body.tint]},${0.1 + part * 0.25})`;
      g.beginPath();
      g.moveTo(cx + trail[from * 2] * radius, cy + trail[from * 2 + 1] * radius);
      for (let k = from + 1; k <= to; k++) g.lineTo(cx + trail[k * 2] * radius, cy + trail[k * 2 + 1] * radius);
      g.stroke();
    }
    g.fillStyle = `rgb(${TINTS[body.tint]})`;
    g.beginPath();
    g.arc(cx + trail[trail.length - 2] * radius, cy + trail[trail.length - 1] * radius, body.size, 0, 6.283);
    g.fill();
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('mousedown', () => {
  if (bodies.filter(b => b.laps >= 0).length < 4) bodies.push(makeBody(0, 1, true));
});

window.undertow?.on('prop', ({ name, value }) => {
  if (!(name in cfg)) return;
  cfg[name] = value;
  if (name === 'bodies') seed();
});

seed();
resize();
requestAnimationFrame(frame);
</script>
