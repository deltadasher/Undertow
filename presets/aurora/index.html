<!doctype html>
<meta charset="utf-8">
<title>Aurora</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080910; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Aurora: two slow curtains over a few fixed stars. The curtains lift toward
// the pointer and a click sends a surge of light through them. Painted at
// quarter resolution and scaled up by the page, which is also what makes it soft.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { glow: 60, pace: 4, stars: true };
const SCALE = 4;

let W = 0, H = 0, clock = 0, surge = 0;
const mouse = { x: 0, active: false };
const stars = [];
for (let i = 0; i < 90; i++) stars.push(Math.random(), Math.random() * 0.75, 0.25 + Math.random() * 0.6);

function resize() {
  W = canvas.width = Math.max(1, Math.ceil(innerWidth / SCALE));
  H = canvas.height = Math.max(1, Math.ceil(innerHeight / SCALE));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += dt * cfg.pace / 4;
  surge = Math.max(0, surge - dt / 2.6);
  const t = clock, lit = surge * surge * (3 - 2 * surge);

  g.globalCompositeOperation = 'source-over';
  const night = g.createLinearGradient(0, 0, 0, H);
  night.addColorStop(0, '#05060b'); night.addColorStop(1, '#080910');
  g.globalAlpha = 1; g.fillStyle = night; g.fillRect(0, 0, W, H);
  if (cfg.stars) {
    g.fillStyle = '#eee9dc';
    for (let i = 0; i < stars.length; i += 3) {
      g.globalAlpha = stars[i + 2];
      g.fillRect(stars[i] * W, stars[i + 1] * H, 1, 1);
    }
    g.globalAlpha = 1;
  }

  g.globalCompositeOperation = 'lighter';
  const px = mouse.active ? mouse.x / SCALE : -1e6;
  const strength = cfg.glow / 100 * (1 + lit * 0.9);
  // Each curtain is a row of narrow columns: brightest at the hem and fading
  // upward from green through cyan to rose. Neighbouring columns differ in
  // height and brightness, which is what reads as rays.
  for (let c = 0; c < 2; c++) {
    const base = H * (0.56 + c * 0.14), k = 0.013 + c * 0.006;
    for (let x = 0; x < W; x += 2) {
      const lift = Math.exp(-Math.pow((x - px) / (W * 0.1), 2));
      const hem = base + Math.sin(x * k + t * (0.19 + c * 0.07) + c * 2.1) * H * 0.075
                + Math.sin(x * k * 2.7 - t * 0.27) * H * 0.03 - lift * H * 0.05;
      const ray = 0.55 + 0.45 * Math.sin(x * 0.31 + t * 0.9 + c * 1.3) * Math.sin(x * 0.047 - t * 0.35 + c);
      const tall = H * (0.2 + 0.2 * ray + 0.08 * lift + lit * 0.08);
      const alpha = Math.min(0.9, (0.2 + 0.5 * ray + 0.25 * lift) * strength * (c === 0 ? 1 : 0.7));
      const column = g.createLinearGradient(0, hem + 3, 0, hem - tall);
      column.addColorStop(0, 'rgba(119,214,174,0)');
      column.addColorStop(0.07, `rgba(119,214,174,${alpha})`);
      column.addColorStop(0.45, `rgba(114,217,231,${alpha * 0.4})`);
      column.addColorStop(1, 'rgba(236,142,174,0)');
      g.fillStyle = column;
      g.fillRect(x, hem - tall, 2, tall + 3);
    }
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('mousedown', () => { surge = 1; });

window.undertow?.on('prop', ({ name, value }) => { if (name in cfg) cfg[name] = value; });

resize();
requestAnimationFrame(frame);
</script>
