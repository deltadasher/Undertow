<!doctype html>
<meta charset="utf-8">
<title>Contours</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #080910; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Contours: a topographic map of terrain that never stops shifting. Heights
// come from layered noise; marching squares traces the level lines, with every
// fourth one drawn heavier like an index contour. The pointer raises a hill
// under itself and a click sends a ripple through the land.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { color: '#72d9e7', levels: 14, scale: 1, speed: 1 };
const CELL = 14;
let W = 0, H = 0, nx = 0, ny = 0, field = new Float32Array(0), clock = 0;
const mouse = { x: 0, y: 0, active: false, lift: 0 };
const waves = [];

// Smooth 3D value noise from an integer hash.
function hash(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 2147483647);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const ease = t => t * t * (3 - 2 * t);
function noise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const u = ease(x - xi), v = ease(y - yi), w = ease(z - zi);
  const lerp = (a, b, t) => a + (b - a) * t;
  const plane = k => lerp(lerp(hash(xi, yi, k), hash(xi + 1, yi, k), u), lerp(hash(xi, yi + 1, k), hash(xi + 1, yi + 1, k), u), v);
  return lerp(plane(zi), plane(zi + 1), w);
}

function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  nx = Math.ceil(W / CELL) + 1; ny = Math.ceil(H / CELL) + 1;
  field = new Float32Array(nx * ny);
}

function sample() {
  const k = 0.035 / cfg.scale, t = clock * 0.06;
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      let h = noise(i * k, j * k, t) * 0.65 + noise(i * k * 2.3 + 40, j * k * 2.3, t * 1.7) * 0.35;
      const px = i * CELL, py = j * CELL;
      if (mouse.lift > 0.01) {
        const dx = px - mouse.x, dy = py - mouse.y;
        h += mouse.lift * 0.3 * Math.exp(-(dx * dx + dy * dy) / 40000);
      }
      for (const wave of waves) {
        const d = Math.hypot(px - wave.x, py - wave.y) - wave.r;
        h += wave.power * 0.12 * Math.exp(-d * d / 3000) * Math.cos(d / 22);
      }
      field[j * nx + i] = h;
    }
  }
}

// Marching squares for one level, appended to the current path.
function trace(level) {
  for (let j = 0; j < ny - 1; j++) {
    for (let i = 0; i < nx - 1; i++) {
      const a = field[j * nx + i], b = field[j * nx + i + 1], c = field[(j + 1) * nx + i + 1], d = field[(j + 1) * nx + i];
      const code = (a > level) | (b > level) << 1 | (c > level) << 2 | (d > level) << 3;
      if (code === 0 || code === 15) continue;
      const x = i * CELL, y = j * CELL, f = (p, q) => (level - p) / (q - p) * CELL;
      const top = [x + f(a, b), y], right = [x + CELL, y + f(b, c)], bottom = [x + f(d, c), y + CELL], left = [x, y + f(a, d)];
      const seg = (p, q) => { g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); };
      switch (code) {
        case 1: case 14: seg(left, top); break;
        case 2: case 13: seg(top, right); break;
        case 3: case 12: seg(left, right); break;
        case 4: case 11: seg(right, bottom); break;
        case 6: case 9: seg(top, bottom); break;
        case 7: case 8: seg(left, bottom); break;
        case 5: seg(left, top); seg(right, bottom); break;
        case 10: seg(top, right); seg(left, bottom); break;
      }
    }
  }
}

let last = performance.now(), due = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  clock += dt * cfg.speed;
  mouse.lift += ((mouse.active ? 1 : 0) - mouse.lift) * Math.min(1, dt * 3);
  for (let i = waves.length - 1; i >= 0; i--) {
    waves[i].r += dt * 380; waves[i].power -= dt * 0.45;
    if (waves[i].power <= 0) waves.splice(i, 1);
  }
  // The map is redrawn 24 times a second; lines this slow do not need more.
  if ((due -= dt) <= 0) {
    due = 1 / 24;
    sample();
    g.fillStyle = '#080910'; g.fillRect(0, 0, W, H);
    g.strokeStyle = cfg.color; g.lineJoin = 'round';
    const n = Math.round(cfg.levels);
    for (const heavy of [false, true]) {
      g.beginPath();
      for (let l = 1; l <= n; l++) if ((l % 4 === 0) === heavy) trace(0.12 + l / (n + 1) * 0.8);
      g.globalAlpha = heavy ? 0.85 : 0.32; g.lineWidth = heavy ? 1.6 : 1;
      g.stroke();
    }
    g.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('mousedown', e => { waves.push({ x: e.clientX, y: e.clientY, r: 0, power: 1 }); if (waves.length > 4) waves.shift(); });

window.undertow?.on('prop', ({ name, value }) => { if (name in cfg) cfg[name] = value; });

resize();
requestAnimationFrame(frame);
</script>
