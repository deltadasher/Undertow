<!doctype html>
<meta charset="utf-8">
<title>Flow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Flow: particles drift along a slowly shifting vector field and leave fading
// trails. The pointer is a whirlpool; click to scatter everything near it.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { count: 2500, speed: 1, hue: 205, spread: 70, fade: 0.045 };

let W = 0, H = 0, P = new Float32Array(0);   // x, y, vx, vy per particle
const mouse = { x: 0, y: 0, active: false };

function spawn(i) {
  P[i] = Math.random() * W; P[i + 1] = Math.random() * H; P[i + 2] = 0; P[i + 3] = 0;
}
function fit() {
  const old = P;
  P = new Float32Array(Math.round(cfg.count) * 4);
  P.set(old.subarray(0, Math.min(old.length, P.length)));
  for (let i = old.length; i < P.length; i += 4) spawn(i);
}
function resize() {
  W = canvas.width = innerWidth; H = canvas.height = innerHeight;
  g.fillStyle = '#05070b'; g.fillRect(0, 0, W, H);
  for (let i = 0; i < P.length; i += 4) spawn(i);
}

// Cheap smooth field: a few drifting sine waves summed into an angle.
function angle(x, y, t) {
  const u = x * 0.0021, v = y * 0.0021;
  return 3.2 * (Math.sin(u * 1.7 + t * 0.21) + Math.sin(v * 2.3 - t * 0.17) + Math.sin((u + v) * 1.1 + t * 0.13)
              + 0.5 * Math.sin(u * 4.1 - v * 3.3 + t * 0.29));
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000) * 60;   // in 60 Hz frames
  last = now;
  const t = now / 1000;

  g.globalCompositeOperation = 'source-over';
  g.fillStyle = `rgba(5,7,11,${cfg.fade})`;
  g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = 'lighter';
  g.lineWidth = 1;

  // Draw in a few hue bands so the stroke style only changes a few times.
  const BANDS = 6, per = Math.ceil(P.length / 4 / BANDS) * 4;
  for (let b = 0; b < BANDS; b++) {
    g.strokeStyle = `hsla(${(cfg.hue + (b / (BANDS - 1) - 0.5) * cfg.spread + 360) % 360} 85% 62% / 0.5)`;
    g.beginPath();
    for (let i = b * per; i < Math.min(P.length, (b + 1) * per); i += 4) {
      let x = P[i], y = P[i + 1];
      const a = angle(x, y, t);
      let ax = Math.cos(a) * 0.12, ay = Math.sin(a) * 0.12;
      if (mouse.active) {
        const dx = x - mouse.x, dy = y - mouse.y, d2 = dx * dx + dy * dy;
        if (d2 < 62500) {                      // 250 px whirlpool: mostly tangential, slightly inward
          const k = (1 - d2 / 62500) * 0.5 / (Math.sqrt(d2) + 1);
          ax += (-dy - dx * 0.25) * k; ay += (dx - dy * 0.25) * k;
        }
      }
      const vx = P[i + 2] = (P[i + 2] + ax * dt) * 0.965, vy = P[i + 3] = (P[i + 3] + ay * dt) * 0.965;
      const nx = x + vx * dt * cfg.speed, ny = y + vy * dt * cfg.speed;
      g.moveTo(x, y); g.lineTo(nx, ny);
      if (nx < 0 || nx > W || ny < 0 || ny > H || Math.random() < 0.0015) spawn(i);
      else { P[i] = nx; P[i + 1] = ny; }
    }
    g.stroke();
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('mousedown', e => {
  for (let i = 0; i < P.length; i += 4) {
    const dx = P[i] - e.clientX, dy = P[i + 1] - e.clientY, d = Math.hypot(dx, dy);
    if (d < 320 && d > 0.5) { const k = (1 - d / 320) * 14 / d; P[i + 2] += dx * k; P[i + 3] += dy * k; }
  }
});

window.undertow?.on('prop', ({ name, value }) => {
  if (!(name in cfg)) return;
  cfg[name] = value;
  if (name === 'count') fit();
});

fit();
resize();
requestAnimationFrame(frame);
</script>
