<!doctype html>
<meta charset="utf-8">
<title>Ripples</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06151b; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Ripples: a still pond in the rain. The surface is a height field stepped
// with the wave equation at a quarter of the screen resolution, then lit from
// its slope so crests catch the light. Moving the pointer drags a wake; a
// click drops a stone.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { rain: 2, calm: 4, color: '#0d3b4a', light: '#bfeff2' };
const SCALE = 4;
let W = 0, H = 0, now = new Float32Array(0), old = new Float32Array(0), image = null;
let water = [13, 59, 74], light = [191, 239, 242];

const rgb = hex => [1, 3, 5].map(i => parseInt(String(hex).slice(i, i + 2), 16) || 0);
function resize() {
  W = canvas.width = Math.max(4, Math.ceil(innerWidth / SCALE)); H = canvas.height = Math.max(4, Math.ceil(innerHeight / SCALE));
  now = new Float32Array(W * H); old = new Float32Array(W * H);
  image = g.createImageData(W, H);
  for (let i = 3; i < image.data.length; i += 4) image.data[i] = 255;
}
function drop(x, y, radius, depth) {
  const r = Math.ceil(radius);
  for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
    const px = Math.round(x) + i, py = Math.round(y) + j, d2 = i * i + j * j;
    if (px > 0 && px < W - 1 && py > 0 && py < H - 1 && d2 <= r * r) now[py * W + px] -= depth * Math.cos(Math.sqrt(d2) / r * 1.5708);
  }
}
function step() {
  const damp = 1 - cfg.calm * 0.0022;
  for (let y = 1; y < H - 1; y++) {
    for (let i = y * W + 1, end = y * W + W - 1; i < end; i++)
      old[i] = ((now[i - 1] + now[i + 1] + now[i - W] + now[i + W]) * 0.5 - old[i]) * damp;
  }
  const swap = now; now = old; old = swap;
}
function shade() {
  const data = image.data;
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = y * W + x, sx = now[i + 1] - now[i - 1], sy = now[i + W] - now[i - W];
      // Slope toward the light brightens, slope away darkens; steep crests sparkle.
      const lit = (sx + sy) * 0.9, spark = Math.max(0, lit - 0.35);
      const base = 0.62 + (y / H) * 0.5 + Math.min(0.5, Math.max(-0.45, lit * 0.6));
      const o = i * 4, s = Math.min(1, spark * spark * 6 + Math.max(0, lit) * 0.25);
      data[o] = water[0] * base + (light[0] - water[0]) * s;
      data[o + 1] = water[1] * base + (light[1] - water[1]) * s;
      data[o + 2] = water[2] * base + (light[2] - water[2]) * s;
    }
  }
  g.putImageData(image, 0, 0);
}

let last = performance.now(), carry = 0, rainCarry = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  rainCarry += dt * cfg.rain;
  while (rainCarry >= 1) { rainCarry -= 1; drop(1 + Math.random() * (W - 2), 1 + Math.random() * (H - 2), 2 + Math.random() * 2, 0.5 + Math.random() * 0.9); }
  if (Math.random() < rainCarry) { rainCarry = 0; drop(1 + Math.random() * (W - 2), 1 + Math.random() * (H - 2), 2.5, 0.8); }
  for (carry += dt * 60; carry >= 1; carry -= 1) step();   // fixed steps, so waves travel at one speed
  shade();
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => drop(e.clientX / SCALE, e.clientY / SCALE, 2.5, 0.35));
addEventListener('mousedown', e => drop(e.clientX / SCALE, e.clientY / SCALE, 7, 2.2));

window.undertow?.on('prop', ({ name, value }) => {
  if (!(name in cfg)) return;
  cfg[name] = value;
  if (name === 'color') water = rgb(value);
  if (name === 'light') light = rgb(value);
});

resize();
requestAnimationFrame(frame);
</script>
