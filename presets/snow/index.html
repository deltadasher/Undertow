<!doctype html>
<meta charset="utf-8">
<title>Snow</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a1024; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<canvas id="c"></canvas>
<script>
// Snow: three depth layers of flakes, wind you can push around with the
// pointer, and drifts that build up along the bottom edge. Click to kick a drift.
const canvas = document.getElementById('c');
const g = canvas.getContext('2d');
const cfg = { density: 350, wind: 0.6, settle: true, tint: '#e4ecff', sky: '#0a1024' };

const COL = 4;                 // width of one drift column in px
let W = 0, H = 0, flakes = [], pile = new Float32Array(1), sky = null;
let gust = 0;
const mouse = { x: -1e5, y: -1e5, px: 0, active: false };

function makeFlake(fromTop) {
  const z = Math.random();     // 0 = far, 1 = near
  return {
    x: Math.random() * W,
    y: fromTop ? -8 : Math.random() * H,
    z, r: 0.7 + z * 2.4,
    fall: 18 + z * 75,
    phase: Math.random() * 6.283, sway: 0.5 + Math.random() * 1.5,
    kx: 0, ky: 0,              // leftover impulse from a kick
  };
}

function fit() {
  while (flakes.length < cfg.density) flakes.push(makeFlake(false));
  flakes.length = Math.min(flakes.length, Math.max(cfg.density, 0));
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  pile = new Float32Array(Math.ceil(W / COL) + 1);
  sky = null;
  flakes = [];
  fit();
}

function shade(hex, f) {       // scale a #rrggbb colour's brightness
  const n = parseInt(hex.slice(1), 16);
  const ch = s => Math.max(0, Math.min(255, Math.round(((n >> s) & 255) * f + (f > 1 ? 18 * (f - 1) : 0))));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

function drawSky() {
  if (!sky) {
    sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, shade(cfg.sky, 0.55));
    sky.addColorStop(0.7, cfg.sky);
    sky.addColorStop(1, shade(cfg.sky, 1.9));
  }
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);
}

function settleAt(x, amount) {
  const i = Math.max(0, Math.min(pile.length - 1, Math.round(x / COL)));
  pile[i] += amount;
}

function relaxPile() {
  // Snow slides sideways when a column gets much taller than its neighbour.
  const maxSlope = 1.6;
  for (let i = 0; i < pile.length - 1; i++) {
    const d = pile[i] - pile[i + 1];
    if (d > maxSlope) { const m = (d - maxSlope) / 2; pile[i] -= m; pile[i + 1] += m; }
    else if (d < -maxSlope) { const m = (-d - maxSlope) / 2; pile[i] += m; pile[i + 1] -= m; }
  }
  // Slow melt once drifts get tall, so they never swallow the screen.
  let peak = 0;
  for (let i = 0; i < pile.length; i++) if (pile[i] > peak) peak = pile[i];
  if (peak > H * 0.16) for (let i = 0; i < pile.length; i++) pile[i] *= 0.999;
}

function kick(x, y) {
  gust += (x < W / 2 ? 1 : -1) * 220;
  const reach = 140;
  for (let i = Math.max(0, Math.floor((x - reach) / COL)); i < Math.min(pile.length, (x + reach) / COL); i++) {
    const px = i * COL, falloff = 1 - Math.abs(px - x) / reach;
    const taken = pile[i] * 0.8 * falloff;
    pile[i] -= taken;
    for (let n = 0; n < taken / 3 && flakes.length < cfg.density * 2; n++) {
      const f = makeFlake(true);
      f.x = px + Math.random() * COL; f.y = H - pile[i] - Math.random() * taken;
      f.kx = (px - x) * 3 + (Math.random() - 0.5) * 200;
      f.ky = -(200 + Math.random() * 350) * falloff;
      flakes.push(f);
    }
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now / 1000;
  gust *= Math.pow(0.25, dt);
  const wind = cfg.wind * 40 + gust;

  drawSky();
  g.fillStyle = cfg.tint;
  for (let i = flakes.length - 1; i >= 0; i--) {
    const f = flakes[i];
    f.kx *= Math.pow(0.08, dt); f.ky *= Math.pow(0.08, dt);
    f.x += (wind * (0.35 + f.z) + Math.sin(t * f.sway + f.phase) * 14 * f.z + f.kx) * dt;
    f.y += (f.fall + f.ky) * dt;

    if (mouse.active) {        // flakes part around the pointer
      const dx = f.x - mouse.x, dy = f.y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 8100 && d2 > 1) { const k = (1 - d2 / 8100) * 260 * dt / Math.sqrt(d2); f.x += dx * k; f.y += dy * k; }
    }
    if (f.x < -10) f.x += W + 20; else if (f.x > W + 10) f.x -= W + 20;

    const ground = H - (cfg.settle ? pile[Math.max(0, Math.min(pile.length - 1, Math.round(f.x / COL)))] : 0);
    if (f.y >= ground) {
      if (cfg.settle && f.z > 0.35) settleAt(f.x, f.r * 0.9);
      if (flakes.length > cfg.density) { flakes.splice(i, 1); continue; }
      flakes[i] = makeFlake(true);
      continue;
    }
    g.globalAlpha = 0.25 + f.z * 0.7;
    g.beginPath();
    g.arc(f.x, f.y, f.r, 0, 6.283);
    g.fill();
  }
  g.globalAlpha = 1;

  if (cfg.settle) {
    relaxPile();
    g.beginPath();
    g.moveTo(0, H);
    for (let i = 0; i < pile.length; i++) g.lineTo(i * COL, H - pile[i]);
    g.lineTo(W, H);
    g.closePath();
    g.fill();
  }
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('mousemove', e => {
  if (mouse.active) gust += (e.clientX - mouse.px) * 0.6;   // dragging the pointer stirs the wind
  mouse.x = e.clientX; mouse.y = e.clientY; mouse.px = e.clientX; mouse.active = true;
});
addEventListener('mouseleave', () => { mouse.active = false; });
addEventListener('mousedown', e => kick(e.clientX, e.clientY));

window.undertow?.on('prop', ({ name, value }) => {
  if (!(name in cfg)) return;
  cfg[name] = value;
  if (name === 'density') fit();
  if (name === 'sky') { sky = null; document.body.style.background = value; }
  if (name === 'settle' && !value) pile.fill(0);
});

resize();
requestAnimationFrame(frame);
</script>
